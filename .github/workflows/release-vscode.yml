name: Publish VS Code extension

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    name: vsce publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: publish (skip if version exists)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce publish 2>&1 | tee /tmp/vsce.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ] && grep -q 'already exists' /tmp/vsce.log; then
            echo "::warning::Version already published — skipping"
            exit 0
          fi
          exit $status
