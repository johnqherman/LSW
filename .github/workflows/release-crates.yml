name: Publish crates

on:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p lsw-path --no-verify 2>&1 | tee /tmp/cp.log || grep -q 'already uploaded' /tmp/cp.log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 15
      - run: cargo publish -p lsw-pe --no-verify 2>&1 | tee /tmp/cp.log || grep -q 'already uploaded' /tmp/cp.log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 15
      - run: cargo publish -p lsw-config --no-verify 2>&1 | tee /tmp/cp.log || grep -q 'already uploaded' /tmp/cp.log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 15
      - run: cargo publish -p lsw-toolchain --no-verify 2>&1 | tee /tmp/cp.log || grep -q 'already uploaded' /tmp/cp.log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p lsw-runtime --no-verify 2>&1 | tee /tmp/cp.log || grep -q 'already uploaded' /tmp/cp.log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 15
      - run: cargo publish -p lsw-core --no-verify 2>&1 | tee /tmp/cp.log || grep -q 'already uploaded' /tmp/cp.log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 15
      - run: cargo publish -p lsw --no-verify 2>&1 | tee /tmp/cp.log || grep -q 'already uploaded' /tmp/cp.log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
